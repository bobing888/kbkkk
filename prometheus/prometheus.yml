global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "kline-api"

  - job_name: "auto-follow-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["auto-follow-worker:8001"]
        labels:
          service: "auto-follow-worker"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

rule_files:
  - "/etc/prometheus/rules/*.yml"
